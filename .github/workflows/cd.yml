name: _eShop - Deploy to Environment

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub Environment and matching Bicep environment parameter.
        required: true
        type: string
      resource-group:
        description: CAF-compliant resource group name for this deployment.
        required: true
        type: string
      container-registry:
        description: Globally unique ACR name for this deployment environment.
        required: true
        type: string
      location:
        description: Azure region for this deployment.
        required: true
        type: string
      region-code:
        description: CAF region abbreviation.
        required: true
        type: string
      environment-code:
        description: 'CAF environment abbreviation. Use stg or prd.'
        required: true
        type: string
      image-tag:
        description: Immutable full Git commit SHA to build and deploy.
        required: true
        type: string
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: eshop-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check out immutable source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.image-tag }}

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision resource group and container registry
        shell: bash
        run: |
          az deployment sub create \
            --name "bootstrap-${{ github.run_id }}" \
            --location "${{ inputs.location }}" \
            --template-file infra/bootstrap.bicep \
            --parameters location="${{ inputs.location }}" \
                         resourceGroupName="${{ inputs.resource-group }}" \
                         containerRegistryName="${{ inputs.container-registry }}" \
                         tags='{"application":"eshop","environment":"${{ inputs.environment-code }}","managedBy":"github-actions"}'

      - name: Authenticate Docker to Azure Container Registry
        shell: bash
        run: az acr login --name "${{ inputs.container-registry }}"

      - name: Build and publish immutable application images
        uses: ./.github/actions/build-push-images
        with:
          registry: ${{ inputs.container-registry }}.azurecr.io
          image-tag: ${{ inputs.image-tag }}

      - name: Preview environment deployment
        shell: bash
        run: |
          az deployment group what-if \
            --resource-group "${{ inputs.resource-group }}" \
            --name "eshop-${{ inputs.environment }}-${{ github.run_id }}" \
            --template-file infra/main.bicep \
            --parameters location="${{ inputs.location }}" \
                         environment="${{ inputs.environment-code }}" \
                         regionCode="${{ inputs.region-code }}" \
                         containerRegistryName="${{ inputs.container-registry }}" \
                         imageTag="${{ inputs.image-tag }}" \
                         postgresAdministratorPassword="${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}" \
                         rabbitMqPassword="${{ secrets.RABBITMQ_PASSWORD }}"

      - name: Deploy environment infrastructure and applications
        shell: bash
        run: |
          az deployment group create \
            --resource-group "${{ inputs.resource-group }}" \
            --name "eshop-${{ inputs.environment }}-${{ github.run_id }}" \
            --template-file infra/main.bicep \
            --parameters location="${{ inputs.location }}" \
                         environment="${{ inputs.environment-code }}" \
                         regionCode="${{ inputs.region-code }}" \
                         containerRegistryName="${{ inputs.container-registry }}" \
                         imageTag="${{ inputs.image-tag }}" \
                         postgresAdministratorPassword="${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}" \
                         rabbitMqPassword="${{ secrets.RABBITMQ_PASSWORD }}"
