name: eShop - Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy.
        required: true
        type: choice
        options:
          - staging
          - production
      image-tag:
        description: Full immutable commit SHA. Required for Production; defaults to the dispatched revision for Staging.
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy-staging:
    if: github.event_name == 'push' || inputs.target == 'staging'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd.yml
    with:
      environment: staging
      resource-group: rg-eshop-stg-swe-001
      container-registry: acreshopstgswe001
      location: swedencentral
      region-code: swe
      environment-code: stg
      image-tag: ${{ inputs.image-tag || github.sha }}
    secrets: inherit

  deploy-production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.image-tag != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd.yml
    needs: deploy-staging
    with:
      environment: production
      resource-group: rg-eshop-prd-swe-001
      container-registry: acreshopprdswe001
      location: swedencentral
      region-code: swe
      environment-code: prd
      image-tag: ${{ inputs.image-tag }}
    secrets: inherit
