name: eShop - Deploy all

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eshop-deploy-all
  cancel-in-progress: false

jobs:
  infrastructure:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-infra.yml
    secrets: inherit

  webapp:
    needs: infrastructure
    permissions:
      contents: read
      id-token: write
      checks: write
      code-quality: write
      pull-requests: read
    uses: ./.github/workflows/deploy-webapp.yml
    secrets: inherit

  identity-api:
    needs: infrastructure
    permissions:
      contents: read
      id-token: write
      checks: write
      code-quality: write
      pull-requests: read
    uses: ./.github/workflows/deploy-identity-api.yml
    secrets: inherit

  basket-api:
    needs: infrastructure
    permissions:
      contents: read
      id-token: write
      checks: write
      code-quality: write
      pull-requests: read
    uses: ./.github/workflows/deploy-basket-api.yml
    secrets: inherit

  catalog-api:
    needs: infrastructure
    permissions:
      contents: read
      id-token: write
      checks: write
      code-quality: write
      pull-requests: read
    uses: ./.github/workflows/deploy-catalog-api.yml
    secrets: inherit

  ordering-api:
    needs: infrastructure
    permissions:
      contents: read
      id-token: write
      checks: write
      code-quality: write
      pull-requests: read
    uses: ./.github/workflows/deploy-ordering-api.yml
    secrets: inherit
