name: eShop - Deploy Catalog API

on:
  push:
    branches: [main]
    paths:
      - 'src/Catalog.API/**'
      - 'src/EventBus/**'
      - 'src/EventBusRabbitMQ/**'
      - 'src/IntegrationEventLogEF/**'
      - 'src/eShop.ServiceDefaults/**'
      - 'azure.yaml'
      - 'infra/azd/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - '.dockerignore'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      checks: write
      pull-requests: read
      code-quality: write
    uses: ./.github/workflows/template-build-service.yml
    with:
      service: catalog-api
      display-name: Catalog API

  staging:
    needs: publish
    if: ${{ github.event_name != 'pull_request' }}
    concurrency:
      group: eshop-deploy-catalog-api-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/template-deploy-service.yml
    with:
      environment: staging
      resource-group: rg-eshop-stg-swe-001
      container-registry: acreshopsharedswe001
      container-registry-resource-group: rg-eshop-shared-swe-001
      location: swedencentral
      region-code: swe
      environment-code: stg
      service: catalog-api
      image-reference: ${{ needs.publish.outputs.image-reference }}
    secrets: inherit

  staging-e2e:
    needs: staging
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
      checks: write
      pull-requests: read
    uses: ./.github/workflows/template-run-e2e-tests.yml
    secrets: inherit

  publish:
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/template-publish-service.yml
    with:
      service: catalog-api
      image-tag: ${{ github.sha }}
      container-registry: acreshopsharedswe001
      container-registry-resource-group: rg-eshop-shared-swe-001
    secrets: inherit

  production:
    needs: [publish, staging, staging-e2e]
    if: ${{ github.event_name != 'pull_request' && needs.staging-e2e.result == 'success' }}
    concurrency:
      group: eshop-deploy-catalog-api-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/template-deploy-service.yml
    with:
      environment: production
      resource-group: rg-eshop-prd-swe-001
      container-registry: acreshopsharedswe001
      container-registry-resource-group: rg-eshop-shared-swe-001
      location: swedencentral
      region-code: swe
      environment-code: prd
      service: catalog-api
      image-reference: ${{ needs.publish.outputs.image-reference }}
    secrets: inherit
