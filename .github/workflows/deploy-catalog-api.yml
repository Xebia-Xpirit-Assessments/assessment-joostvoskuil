name: eShop - Deploy Catalog API

on:
  push:
    branches: [main]
    paths:
      - 'src/Catalog.API/**'
      - 'src/EventBus/**'
      - 'src/EventBusRabbitMQ/**'
      - 'src/IntegrationEventLogEF/**'
      - 'src/eShop.ServiceDefaults/**'
      - 'azure.yaml'
      - 'infra/azd/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - '.dockerignore'
      - '.github/workflows/ci-service.yml'
      - '.github/workflows/deploy-service.yml'
      - '.github/workflows/e2e-gate.yml'
      - '.github/workflows/deploy-catalog-api.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/Catalog.API/**'
      - 'src/EventBus/**'
      - 'src/EventBusRabbitMQ/**'
      - 'src/IntegrationEventLogEF/**'
      - 'src/eShop.ServiceDefaults/**'
      - 'azure.yaml'
      - 'infra/azd/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - '.dockerignore'
      - '.github/workflows/ci-service.yml'
      - '.github/workflows/deploy-service.yml'
      - '.github/workflows/e2e-gate.yml'
      - '.github/workflows/deploy-catalog-api.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: eshop-deploy-catalog-api
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
      checks: write
      code-quality: write
      pull-requests: read
    uses: ./.github/workflows/ci-service.yml
    with:
      service: catalog-api

  staging:
    needs: ci
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-service.yml
    with:
      environment: staging
      resource-group: rg-eshop-stg-swe-001
      container-registry: acreshopstgswe001
      location: swedencentral
      region-code: swe
      environment-code: stg
      service: catalog-api
      image-tag: ${{ github.sha }}
    secrets: inherit

  staging-e2e:
    needs: staging
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-gate.yml
    secrets: inherit

  production:
    needs: staging-e2e
    if: ${{ github.event_name != 'pull_request' && needs.staging-e2e.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-service.yml
    with:
      environment: production
      resource-group: rg-eshop-prd-swe-001
      container-registry: acreshopprdswe001
      location: swedencentral
      region-code: swe
      environment-code: prd
      service: catalog-api
      image-tag: ${{ github.sha }}
    secrets: inherit
