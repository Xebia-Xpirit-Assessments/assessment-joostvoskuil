name: _eShop - Template for building one service

on:
  workflow_call:
    inputs:
      service:
        description: 'Service name: webapp, identity-api, basket-api, catalog-api, or ordering-api.'
        required: true
        type: string
      display-name:
        description: 'Human-readable service name used in job and report titles.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ inputs.display-name }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET and Node.js toolchain
        uses: ./.github/actions/setup-dotnet-node-toolchain

      - name: Resolve project path
        id: project
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          case "$SERVICE" in
            webapp) project='src/WebApp/WebApp.csproj' ;;
            identity-api) project='src/Identity.API/Identity.API.csproj' ;;
            basket-api) project='src/Basket.API/Basket.API.csproj' ;;
            catalog-api) project='src/Catalog.API/Catalog.API.csproj' ;;
            ordering-api) project='src/Ordering.API/Ordering.API.csproj' ;;
            *) echo "Unsupported service: $SERVICE" >&2; exit 2 ;;
          esac
          echo "path=$project" >> "$GITHUB_OUTPUT"

      - name: Restore project
        run: dotnet restore "${{ steps.project.outputs.path }}"

      - name: Build project
        run: dotnet build "${{ steps.project.outputs.path }}" --configuration Release --no-restore

  dockerfile-check:
    name: Validate Docker context (${{ inputs.display-name }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Docker build context
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          case "$SERVICE" in
            webapp) dockerfile='src/WebApp/Dockerfile' ;;
            identity-api) dockerfile='src/Identity.API/Dockerfile' ;;
            basket-api) dockerfile='src/Basket.API/Dockerfile' ;;
            catalog-api) dockerfile='src/Catalog.API/Dockerfile' ;;
            ordering-api) dockerfile='src/Ordering.API/Dockerfile' ;;
            *) echo "Unsupported service: $SERVICE" >&2; exit 2 ;;
          esac
          test -f .dockerignore
          test -f "$dockerfile"

  unit-tests:
    name: Unit tests
    if: ${{ contains(fromJSON('["webapp","basket-api","ordering-api"]'), inputs.service) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      code-quality: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET and Node.js toolchain
        uses: ./.github/actions/setup-dotnet-node-toolchain
        with:
          restore-maui-workload: ${{ inputs.service == 'webapp' && 'true' || 'false' }}

      - name: Resolve unit test project
        id: project
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          case "$SERVICE" in
            webapp) project='tests/ClientApp.UnitTests/ClientApp.UnitTests.csproj' ;;
            basket-api) project='tests/Basket.UnitTests/Basket.UnitTests.csproj' ;;
            ordering-api) project='tests/Ordering.UnitTests/Ordering.UnitTests.csproj' ;;
            *) echo "No unit tests for service: $SERVICE" >&2; exit 2 ;;
          esac
          echo "path=$project" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: >-
          dotnet test "${{ steps.project.outputs.path }}"
          --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=unit.trx"
          --results-directory test-results

      - name: Prepare Cobertura coverage report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          coverage_file=$(find test-results -name coverage.cobertura.xml -print -quit || true)
          if [[ -n "$coverage_file" ]]; then
            cp "$coverage_file" coverage/unit.cobertura.xml
          else
            echo "No Cobertura coverage report was generated."
          fi

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ inputs.service }}-unit
          path: test-results
          if-no-files-found: ignore

      - name: Publish test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Unit tests (${{ inputs.display-name }})
          path: test-results/*.trx
          reporter: dotnet-trx
          fail-on-empty: false
          report-title: Unit tests (${{ inputs.display-name }})

      - name: Upload coverage
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && hashFiles('coverage/*.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: coverage/unit.cobertura.xml
          language: C#
          label: code-coverage/unit-${{ inputs.service }}
          fail-on-error: false

  functional-tests:
    name: Functional tests (${{ inputs.display-name }})
    if: ${{ contains(fromJSON('["catalog-api","ordering-api"]'), inputs.service) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      code-quality: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET and Node.js toolchain
        uses: ./.github/actions/setup-dotnet-node-toolchain

      - name: Resolve functional test project
        id: project
        shell: bash
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          case "$SERVICE" in
            catalog-api) project='tests/Catalog.FunctionalTests/Catalog.FunctionalTests.csproj' ;;
            ordering-api) project='tests/Ordering.FunctionalTests/Ordering.FunctionalTests.csproj' ;;
            *) echo "No functional tests for service: $SERVICE" >&2; exit 2 ;;
          esac
          echo "path=$project" >> "$GITHUB_OUTPUT"

      - name: Run functional tests
        run: >-
          dotnet test "${{ steps.project.outputs.path }}"
          --configuration Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=functional.trx"
          --results-directory test-results

      - name: Prepare Cobertura coverage report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p coverage
          coverage_file=$(find test-results -name coverage.cobertura.xml -print -quit || true)
          if [[ -n "$coverage_file" ]]; then
            cp "$coverage_file" coverage/functional.cobertura.xml
          else
            echo "No Cobertura coverage report was generated."
          fi

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ inputs.service }}-functional
          path: test-results
          if-no-files-found: ignore

      - name: Publish test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Functional tests (${{ inputs.display-name }})
          path: test-results/*.trx
          reporter: dotnet-trx
          fail-on-empty: false
          report-title: Functional tests (${{ inputs.display-name }})

      - name: Upload coverage
        if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && hashFiles('coverage/*.xml') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: coverage/functional.cobertura.xml
          language: C#
          label: code-coverage/functional-${{ inputs.service }}
          fail-on-error: false
