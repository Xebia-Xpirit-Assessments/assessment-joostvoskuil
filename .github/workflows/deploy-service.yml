name: _eShop - Deploy one service

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      resource-group:
        required: true
        type: string
      container-registry:
        required: true
        type: string
      location:
        required: true
        type: string
      region-code:
        required: true
        type: string
      environment-code:
        required: true
        type: string
      service:
        required: true
        type: string
      image-tag:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: ${{ inputs.service }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: eshop-${{ inputs.environment }}-${{ inputs.service }}
      cancel-in-progress: false
    steps:
      - name: Check out immutable source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticate Docker to Azure Container Registry
        shell: bash
        run: az acr login --name "${{ inputs.container-registry }}"

      - name: Build and publish immutable image
        uses: ./.github/actions/build-push-image
        with:
          service: ${{ inputs.service }}
          registry: ${{ inputs.container-registry }}.azurecr.io
          image-tag: ${{ inputs.image-tag }}

      - name: Preview selected application
        shell: bash
        run: |
          az deployment group what-if \
            --resource-group "${{ inputs.resource-group }}" \
            --name "app-${{ inputs.environment }}-${{ inputs.service }}-${{ github.run_id }}" \
            --template-file infra/application.bicep \
            --parameters location="${{ inputs.location }}" environment="${{ inputs.environment-code }}" \
              regionCode="${{ inputs.region-code }}" containerRegistryName="${{ inputs.container-registry }}" \
              service="${{ inputs.service }}" imageTag="${{ inputs.image-tag }}" \
              postgresAdministratorPassword="${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}" \
              rabbitMqPassword="${{ secrets.RABBITMQ_PASSWORD }}"

      - name: Deploy selected application
        shell: bash
        run: |
          az deployment group create \
            --resource-group "${{ inputs.resource-group }}" \
            --name "app-${{ inputs.environment }}-${{ inputs.service }}-${{ github.run_id }}" \
            --template-file infra/application.bicep \
            --parameters location="${{ inputs.location }}" environment="${{ inputs.environment-code }}" \
              regionCode="${{ inputs.region-code }}" containerRegistryName="${{ inputs.container-registry }}" \
              service="${{ inputs.service }}" imageTag="${{ inputs.image-tag }}" \
              postgresAdministratorPassword="${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}" \
              rabbitMqPassword="${{ secrets.RABBITMQ_PASSWORD }}"

      - name: Verify latest revision
        shell: bash
        run: |
          case "${{ inputs.service }}" in
            webapp) app_name="ca-eshop-web-${{ inputs.environment-code }}-${{ inputs.region-code }}-001" ;;
            identity-api) app_name="ca-eshop-identity-${{ inputs.environment-code }}-${{ inputs.region-code }}-001" ;;
            basket-api) app_name="ca-eshop-basket-${{ inputs.environment-code }}-${{ inputs.region-code }}-001" ;;
            catalog-api) app_name="ca-eshop-catalog-${{ inputs.environment-code }}-${{ inputs.region-code }}-001" ;;
            ordering-api) app_name="ca-eshop-ordering-${{ inputs.environment-code }}-${{ inputs.region-code }}-001" ;;
            *) echo "Unsupported service" >&2; exit 2 ;;
          esac
          provisioning=$(az containerapp show --name "$app_name" --resource-group "${{ inputs.resource-group }}" --query "properties.provisioningState" -o tsv)
          [[ "$provisioning" == "Succeeded" ]] || { echo "Container App provisioning state: $provisioning" >&2; exit 1; }
          az containerapp revision list --name "$app_name" --resource-group "${{ inputs.resource-group }}" \
            --query "[?properties.active].{name:name,state:properties.runningState,image:properties.template.containers[0].image}" -o table
