name: _eShop - Template for deploying one service

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      resource-group:
        required: true
        type: string
      container-registry:
        required: true
        type: string
      container-registry-resource-group:
        required: true
        type: string
      location:
        required: true
        type: string
      region-code:
        required: true
        type: string
      environment-code:
        required: true
        type: string
      service:
        required: true
        type: string
      image-tag:
        required: true
        type: string
      source-image:
        description: 'Immutable image reference to import instead of rebuilding. Leave empty for the trusted staging build.'
        required: false
        type: string
        default: ''
      attest:
        description: 'Generate provenance and SBOM attestations for a newly built image.'
        required: false
        type: boolean
        default: false

    outputs:
      image-reference:
        description: 'Fully-qualified immutable image reference deployed by this workflow.'
        value: ${{ jobs.deploy.outputs.image-reference }}

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  deploy:
    name: ${{ inputs.service }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    outputs:
      image-reference: ${{ steps.image.outputs.reference }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: eshop-${{ inputs.environment }}-${{ inputs.service }}
      cancel-in-progress: false
    steps:
      - name: Check out immutable source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v2.2.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Developer CLI
        shell: bash
        run: curl -fsSL https://aka.ms/install-azd.sh | bash

      - name: Sign in to azd with OpenID Connect
        shell: bash
        run: |
          azd auth login \
            --client-id "${{ secrets.AZURE_CLIENT_ID }}" \
            --federated-credential-provider github \
            --tenant-id "${{ secrets.AZURE_TENANT_ID }}"

      - name: Detect which container apps already exist
        shell: bash
        run: |
          set -euo pipefail
          declare -A apps=(
            [WEBAPP_EXISTS]="ca-eshop-web-${{ inputs.environment-code }}-${{ inputs.region-code }}-001"
            [IDENTITY_API_EXISTS]="ca-eshop-identity-${{ inputs.environment-code }}-${{ inputs.region-code }}-001"
            [BASKET_API_EXISTS]="ca-eshop-basket-${{ inputs.environment-code }}-${{ inputs.region-code }}-001"
            [CATALOG_API_EXISTS]="ca-eshop-catalog-${{ inputs.environment-code }}-${{ inputs.region-code }}-001"
            [ORDERING_API_EXISTS]="ca-eshop-ordering-${{ inputs.environment-code }}-${{ inputs.region-code }}-001"
          )
          for key in "${!apps[@]}"; do
            name="${apps[$key]}"
            if az containerapp show --name "$name" --resource-group "${{ inputs.resource-group }}" >/dev/null 2>&1; then
              echo "$key=true" >> "$GITHUB_ENV"
            else
              echo "$key=false" >> "$GITHUB_ENV"
            fi
          done

      - name: Create ephemeral azd environment
        shell: bash
        run: |
          set -euo pipefail
          azd env new "eshop-${{ inputs.environment-code }}" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_LOCATION "${{ inputs.location }}"
          azd env set AZURE_RESOURCE_GROUP "${{ inputs.resource-group }}"
          azd env set CONTAINER_REGISTRY_NAME "${{ inputs.container-registry }}"
          azd env set CONTAINER_REGISTRY_RESOURCE_GROUP "${{ inputs.container-registry-resource-group }}"
          azd env set ENVIRONMENT_CODE "${{ inputs.environment-code }}"
          azd env set REGION_CODE "${{ inputs.region-code }}"
          azd env set IMAGE_TAG "${{ inputs.image-tag }}"
          azd env set AZD_SERVICE_NAME "${{ inputs.service }}"
          azd env set WEBAPP_EXISTS "$WEBAPP_EXISTS"
          azd env set IDENTITY_API_EXISTS "$IDENTITY_API_EXISTS"
          azd env set BASKET_API_EXISTS "$BASKET_API_EXISTS"
          azd env set CATALOG_API_EXISTS "$CATALOG_API_EXISTS"
          azd env set ORDERING_API_EXISTS "$ORDERING_API_EXISTS"
          # Ephemeral, never-committed azd environment; plain env values are fine, nothing persists past this job.
          azd env set POSTGRES_ADMINISTRATOR_PASSWORD "${{ secrets.POSTGRES_ADMINISTRATOR_PASSWORD }}"
          azd env set RABBITMQ_PASSWORD "${{ secrets.RABBITMQ_PASSWORD }}"

      - name: Provision container apps with azd
        shell: bash
        run: azd provision --no-prompt

      - name: Validate production promotion input
        if: ${{ inputs.environment == 'production' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${{ inputs.source-image }}" ]] || {
            echo "Production deployments must promote a staging image by immutable digest." >&2
            exit 1
          }

      - name: Build or promote selected application image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.service }}" in
            webapp)
              dockerfile='src/WebApp/Dockerfile'
              repository='webapp'
              ;;
            identity-api)
              dockerfile='src/Identity.API/Dockerfile'
              repository='identity-api'
              ;;
            basket-api)
              dockerfile='src/Basket.API/Dockerfile'
              repository='basket-api'
              ;;
            catalog-api)
              dockerfile='src/Catalog.API/Dockerfile'
              repository='catalog-api'
              ;;
            ordering-api)
              dockerfile='src/Ordering.API/Dockerfile'
              repository='ordering-api'
              ;;
            *) echo "Unsupported service: ${{ inputs.service }}" >&2; exit 2 ;;
          esac

          registry_login_server=$(az acr show --name "${{ inputs.container-registry }}" --resource-group "${{ inputs.container-registry-resource-group }}" --query loginServer -o tsv)
          tagged_image="$registry_login_server/$repository:${{ inputs.image-tag }}"

          az acr login --name "${{ inputs.container-registry }}" --expose-token --query accessToken -o tsv | \
            docker login "$registry_login_server" --username 00000000-0000-0000-0000-000000000000 --password-stdin
          if [[ -n "${{ inputs.source-image }}" ]]; then
            source_digest="${{ inputs.source-image }}"
            source_digest="${source_digest##*@}"
            source_registry="${{ inputs.source-image }}"
            source_registry="${source_registry%%/*}"
            [[ "$source_registry" == "$registry_login_server" ]] || {
              echo "Production must deploy an image from the shared registry." >&2
              exit 1
            }
          else
            docker build --file "$dockerfile" --tag "$tagged_image" .
            docker push "$tagged_image"
          fi

          if [[ -n "${source_digest:-}" ]]; then
            digest="$source_digest"
          else
            digest=$(az acr repository show --name "${{ inputs.container-registry }}" --image "$repository:${{ inputs.image-tag }}" --query digest -o tsv)
          fi
          [[ -n "$digest" && "$digest" != 'null' ]] || { echo "ACR did not return an image digest." >&2; exit 1; }
          if [[ -n "${source_digest:-}" && "$digest" != "$source_digest" ]]; then
            echo "Imported image digest does not match the verified staging digest." >&2
            exit 1
          fi
          image="$registry_login_server/$repository@$digest"
          {
            echo "repository=$registry_login_server/$repository"
            echo "digest=$digest"
            echo "reference=$image"
          } >> "$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        if: ${{ inputs.attest }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.reference }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Generate build provenance attestation
        id: provenance
        if: ${{ inputs.attest }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM attestation
        id: sbom
        if: ${{ inputs.attest }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Verify build provenance
        if: ${{ inputs.attest }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify "oci://${{ steps.image.outputs.reference }}"
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/template-deploy-service.yml"
          --source-digest "$GITHUB_SHA"

      - name: Record signed build evidence
        if: ${{ inputs.attest }}
        shell: bash
        run: |
          set -euo pipefail
          provenance_url="${{ steps.provenance.outputs.attestation-url }}"
          sbom_url="${{ steps.sbom.outputs.attestation-url }}"
          [[ -n "$provenance_url" ]] || { echo "Provenance attestation was not persisted." >&2; exit 1; }
          [[ -n "$sbom_url" ]] || { echo "SBOM attestation was not persisted." >&2; exit 1; }
          cat > deployment-evidence.json <<EOF
          {
            "service": "${{ inputs.service }}",
            "sourceCommit": "${{ github.sha }}",
            "image": "${{ steps.image.outputs.reference }}",
            "provenanceAttestation": "$provenance_url",
            "sbomAttestation": "$sbom_url"
          }
          EOF

      - name: Upload signed build evidence
        if: ${{ inputs.attest }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-build-evidence-${{ inputs.service }}-${{ github.sha }}
          path: |
            sbom.spdx.json
            deployment-evidence.json
          retention-days: 365

      - name: Deploy selected application image
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.service }}" in
            webapp) app_name="ca-eshop-web-${{ inputs.environment-code }}-${{ inputs.region-code }}-001" ;;
            identity-api) app_name="ca-eshop-identity-${{ inputs.environment-code }}-${{ inputs.region-code }}-001" ;;
            basket-api) app_name="ca-eshop-basket-${{ inputs.environment-code }}-${{ inputs.region-code }}-001" ;;
            catalog-api) app_name="ca-eshop-catalog-${{ inputs.environment-code }}-${{ inputs.region-code }}-001" ;;
            ordering-api) app_name="ca-eshop-ordering-${{ inputs.environment-code }}-${{ inputs.region-code }}-001" ;;
            *) echo "Unsupported service" >&2; exit 2 ;;
          esac
          az containerapp update --name "$app_name" --resource-group "${{ inputs.resource-group }}" --image "${{ steps.image.outputs.reference }}" --output none

      - name: Verify latest revision
        shell: bash
        run: |
          case "${{ inputs.service }}" in
            webapp) app_name="ca-eshop-web-${{ inputs.environment-code }}-${{ inputs.region-code }}-001" ;;
            identity-api) app_name="ca-eshop-identity-${{ inputs.environment-code }}-${{ inputs.region-code }}-001" ;;
            basket-api) app_name="ca-eshop-basket-${{ inputs.environment-code }}-${{ inputs.region-code }}-001" ;;
            catalog-api) app_name="ca-eshop-catalog-${{ inputs.environment-code }}-${{ inputs.region-code }}-001" ;;
            ordering-api) app_name="ca-eshop-ordering-${{ inputs.environment-code }}-${{ inputs.region-code }}-001" ;;
            *) echo "Unsupported service" >&2; exit 2 ;;
          esac
          provisioning=$(az containerapp show --name "$app_name" --resource-group "${{ inputs.resource-group }}" --query "properties.provisioningState" -o tsv)
          [[ "$provisioning" == "Succeeded" ]] || { echo "Container App provisioning state: $provisioning" >&2; exit 1; }
          az containerapp revision list --name "$app_name" --resource-group "${{ inputs.resource-group }}" \
            --query "[?properties.active].{name:name,state:properties.runningState,image:properties.template.containers[0].image}" -o table
