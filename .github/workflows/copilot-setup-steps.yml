name: _Copilot Setup Steps

# Validate changes to this setup file and allow manual runs from the Actions tab.
on:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # This job name is required for Copilot cloud agent setup steps.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore .NET Aspire workload
        run: dotnet workload restore src/eShop.AppHost/eShop.AppHost.csproj

      - name: Verify Docker is available
        run: docker info

      - name: Restore web solution
        run: dotnet restore eShop.Web.slnf

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Configure seeded e2e test user
        run: |
          cat > .env <<'EOF'
          USERNAME1=alice
          PASSWORD=Pass123$
          EOF

      - name: Install Playwright Chromium
        run: npx playwright install chromium
