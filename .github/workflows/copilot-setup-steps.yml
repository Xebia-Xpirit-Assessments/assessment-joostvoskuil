name: _Copilot Setup Steps

# Validate changes to this setup file and allow manual runs from the Actions tab.
on:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/setup-dotnet-node-toolchain/**

jobs:
  # This job name is required for Copilot cloud agent setup steps.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET and Node.js toolchain
        uses: ./.github/actions/setup-dotnet-node-toolchain
        with:
          restore-web-solution: 'true'
          install-npm-dependencies: 'true'

      - name: Verify Docker is available
        run: docker info

      - name: Configure seeded e2e test user
        run: |
          cat > .env <<'EOF'
          USERNAME1=alice
          PASSWORD=Pass123$
          EOF

      - name: Install Playwright Chromium
        run: npx playwright install chromium
