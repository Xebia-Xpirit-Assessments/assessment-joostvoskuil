name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'e2e/**'
      - 'infra/**'
      - '*.sln'
      - '*.slnf'
      - '*.props'
      - '*.targets'
      - 'global.json'
      - 'nuget.config'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.dockerignore'
      - 'src/**/Dockerfile'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-service.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'e2e/**'
      - 'infra/**'
      - '*.sln'
      - '*.slnf'
      - '*.props'
      - '*.targets'
      - 'global.json'
      - 'nuget.config'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.dockerignore'
      - 'src/**/Dockerfile'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-service.yml'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  infrastructure:
    name: Validate Bicep templates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Bicep
        run: |
          az bicep build --file infra/bootstrap.bicep --stdout > /dev/null
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/application.bicep --stdout > /dev/null

  ci-webapp:
    name: CI (webapp)
    permissions:
      contents: read
      checks: write
      code-quality: write
      pull-requests: read
    uses: ./.github/workflows/ci-service.yml
    with:
      service: webapp

  ci-identity-api:
    name: CI (identity-api)
    permissions:
      contents: read
      checks: write
      code-quality: write
      pull-requests: read
    uses: ./.github/workflows/ci-service.yml
    with:
      service: identity-api

  ci-basket-api:
    name: CI (basket-api)
    permissions:
      contents: read
      checks: write
      code-quality: write
      pull-requests: read
    uses: ./.github/workflows/ci-service.yml
    with:
      service: basket-api

  ci-catalog-api:
    name: CI (catalog-api)
    permissions:
      contents: read
      checks: write
      code-quality: write
      pull-requests: read
    uses: ./.github/workflows/ci-service.yml
    with:
      service: catalog-api

  ci-ordering-api:
    name: CI (ordering-api)
    permissions:
      contents: read
      checks: write
      code-quality: write
      pull-requests: read
    uses: ./.github/workflows/ci-service.yml
    with:
      service: ordering-api

  required:
    name: Required
    needs:
      - infrastructure
      - ci-webapp
      - ci-identity-api
      - ci-basket-api
      - ci-catalog-api
      - ci-ordering-api
    if: ${{ always() && needs.infrastructure.result != 'failure' && needs.infrastructure.result != 'cancelled' && needs.ci-webapp.result != 'failure' && needs.ci-webapp.result != 'cancelled' && needs.ci-identity-api.result != 'failure' && needs.ci-identity-api.result != 'cancelled' && needs.ci-basket-api.result != 'failure' && needs.ci-basket-api.result != 'cancelled' && needs.ci-catalog-api.result != 'failure' && needs.ci-catalog-api.result != 'cancelled' && needs.ci-ordering-api.result != 'failure' && needs.ci-ordering-api.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm required CI jobs completed
        run: |
          echo "Infrastructure: ${{ needs.infrastructure.result }}"
          echo "WebApp: ${{ needs.ci-webapp.result }}"
          echo "Identity API: ${{ needs.ci-identity-api.result }}"
          echo "Basket API: ${{ needs.ci-basket-api.result }}"
          echo "Catalog API: ${{ needs.ci-catalog-api.result }}"
          echo "Ordering API: ${{ needs.ci-ordering-api.result }}"
