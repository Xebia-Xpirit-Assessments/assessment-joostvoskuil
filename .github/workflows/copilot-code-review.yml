name: _Copilot Code Review Setup

on:
  pull_request:
    paths:
      - .github/workflows/copilot-code-review.yml
      - .github/actions/setup-dotnet-node-toolchain/**

jobs:
  # This job name is required for Copilot code review setup workflows.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET and Node.js toolchain
        uses: ./.github/actions/setup-dotnet-node-toolchain
