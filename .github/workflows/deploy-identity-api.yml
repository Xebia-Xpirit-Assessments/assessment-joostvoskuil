name: eShop - Deploy Identity API

on:
  push:
    branches: [main]
    paths:
      - 'src/Identity.API/**'
      - 'src/eShop.ServiceDefaults/**'
      - 'azure.yaml'
      - 'infra/azd/**'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'nuget.config'
      - '.dockerignore'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      checks: write
      code-quality: write
      pull-requests: read
    uses: ./.github/workflows/template-build-service.yml
    with:
      service: identity-api
      display-name: Identity API

  staging:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    concurrency:
      group: eshop-deploy-identity-api-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/template-deploy-service.yml
    with:
      environment: staging
      resource-group: rg-eshop-stg-swe-001
      container-registry: acreshopstgswe001
      location: swedencentral
      region-code: swe
      environment-code: stg
      service: identity-api
      image-tag: ${{ github.sha }}
    secrets: inherit

  staging-e2e:
    needs: staging
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
      id-token: write
      checks: write
      pull-requests: read
    uses: ./.github/workflows/template-run-e2e-tests.yml
    secrets: inherit

  production:
    needs: staging-e2e
    if: ${{ github.event_name != 'pull_request' && needs.staging-e2e.result == 'success' }}
    concurrency:
      group: eshop-deploy-identity-api-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/template-deploy-service.yml
    with:
      environment: production
      resource-group: rg-eshop-prd-swe-001
      container-registry: acreshopprdswe001
      location: swedencentral
      region-code: swe
      environment-code: prd
      service: identity-api
      image-tag: ${{ github.sha }}
    secrets: inherit
