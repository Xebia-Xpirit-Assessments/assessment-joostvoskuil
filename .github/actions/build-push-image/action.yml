name: Build and push one eShop image
description: Builds and publishes one allow-listed service image with an immutable tag.

inputs:
  service:
    description: 'Service name: webapp, identity-api, basket-api, catalog-api, or ordering-api.'
    required: true
  registry:
    description: Azure Container Registry login server.
    required: true
  image-tag:
    description: Immutable image tag, normally the commit SHA.
    required: true

runs:
  using: composite
  steps:
    - name: Build and publish selected image
      shell: bash
      env:
        SERVICE: ${{ inputs.service }}
        REGISTRY: ${{ inputs.registry }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        case "$SERVICE" in
          webapp) DOCKERFILE='src/WebApp/Dockerfile' ;;
          identity-api) DOCKERFILE='src/Identity.API/Dockerfile' ;;
          basket-api) DOCKERFILE='src/Basket.API/Dockerfile' ;;
          catalog-api) DOCKERFILE='src/Catalog.API/Dockerfile' ;;
          ordering-api) DOCKERFILE='src/Ordering.API/Dockerfile' ;;
          *) echo "Unsupported deployment service: $SERVICE" >&2; exit 2 ;;
        esac

        image="$REGISTRY/$SERVICE:$IMAGE_TAG"
        docker build --file "$DOCKERFILE" --tag "$image" .
        docker push "$image"
        docker manifest inspect "$image" >/dev/null
        echo "Published immutable image $image"
